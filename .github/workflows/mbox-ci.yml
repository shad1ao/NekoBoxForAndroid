name: mbox CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mbox-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libcore:
    name: libcore ${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - go_target: android/arm64
            abi: arm64-v8a
            optional: false
            go_test: true
          - go_target: android/arm
            abi: armeabi-v7a
            optional: true
            go_test: false
          - go_target: android/386
            abi: x86
            optional: true
            go_test: false
          - go_target: android/amd64
            abi: x86_64
            optional: true
            go_test: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bind-libcore
        with:
          go_target: ${{ matrix.go_target }}
          abi: ${{ matrix.abi }}
          go_test: ${{ matrix.go_test }}
      - uses: actions/upload-artifact@v4
        with:
          name: libcore-${{ matrix.abi }}
          path: app/libs/libcore.aar
          if-no-files-found: error
          retention-days: 7

  apk:
    name: apk ${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: libcore
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            optional: false
          - abi: armeabi-v7a
            optional: true
          - abi: x86
            optional: true
          - abi: x86_64
            optional: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libcore-${{ matrix.abi }}
          path: app/libs
      - uses: ./.github/actions/assemble-apk
        with:
          abi: ${{ matrix.abi }}
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.abi }}
          path: dist-apks/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish debug prerelease
    runs-on: ubuntu-latest
    needs: apk
    if: >
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.apk.result == 'success' || needs.apk.result == 'failure')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: artifacts
      - name: Collect verified APKs and notes
        run: |
          mkdir -p apks
          find artifacts -type f -name '*.apk' -exec cp {} apks/ \;
          for apk in apks/*.apk; do
            base=$(basename "$apk")
            case "$base" in
              *arm64-v8a*) abi=arm64-v8a ;;
              *armeabi-v7a*) abi=armeabi-v7a ;;
              *x86_64*) abi=x86_64 ;;
              *x86*) abi=x86 ;;
              *) echo "unexpected APK name $base" >&2; exit 1 ;;
            esac
            unzip -l "$apk" | grep -q "lib/${abi}/libgojni.so"
          done
          bash buildScript/ci/release_notes.sh apks release-notes.md
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(sed -n 's/^VERSION_NAME=//p' nb4a.properties)
          test -n "$tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "$tag debug-signed test build" \
            --notes-file release-notes.md \
            apks/*.apk apks/SHA256SUMS
